name: Diagnostic core integration

on:
  pull_request:
    branches: [main, integration/diagnostic-core-contracts-v1]
    paths:
      - "src/edi_ingest/diagnostic_core.py"
      - "tests/test_diagnostic_core_bridge.py"
      - "tests/test_kindergarten_core_scenarios.py"
      - "tests/test_faa_drpds_core_scenarios.py"
      - "benchmarks/kindergarten-switchboard/diagnostic-core-module.synthetic.yaml"
      - "benchmarks/faa-drpds/diagnostic-core-module.synthetic.yaml"
      - "docs/objects/faa-drpds-core-integration.md"
      - "docs/architecture/diagnostic-core-integration.md"
      - ".github/workflows/diagnostic-core-integration.yml"
  workflow_dispatch:

jobs:
  core-integration:
    runs-on: ubuntu-latest
    env:
      DIAGNOSTICS_MVP_TOKEN: ${{ secrets.DIAGNOSTICS_MVP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Checkout pinned private diagnostic core
        if: env.DIAGNOSTICS_MVP_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: leverty93/diagnostics-mvp
          ref: 048587b527342f4dc178e8c99e115c974113fbed
          token: ${{ secrets.DIAGNOSTICS_MVP_TOKEN }}
          path: diagnostics-mvp
      - name: Install project and core dependencies
        if: env.DIAGNOSTICS_MVP_TOKEN != ''
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -r diagnostics-mvp/requirements.txt
      - name: Run real-core contract and KSW scenario tests
        if: env.DIAGNOSTICS_MVP_TOKEN != ''
        env:
          DIAGNOSTICS_MVP_PATH: diagnostics-mvp
        run: |
          pytest -q tests/test_diagnostic_core_bridge.py
          pytest -q tests/test_kindergarten_core_scenarios.py
          pytest -q tests/test_faa_drpds_core_scenarios.py
      - name: Fail when private-repository credential is missing
        if: env.DIAGNOSTICS_MVP_TOKEN == ''
        run: |
          echo "::error::Repository secret DIAGNOSTICS_MVP_TOKEN is required. Configure a read-only token for leverty93/diagnostics-mvp to run the real diagnostic-core tests."
          exit 1
