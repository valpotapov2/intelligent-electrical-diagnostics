      basis: Synthetic source-2 evidence-channel pattern; not a source diagnosis
    SWGR_1_section_evidence_loss:
      component: virtual_swgr_1
      basis: Synthetic SWGR-1 evidence-channel pattern; not a section-supply diagnosis
    SWGR_2_section_evidence_loss:
      component: virtual_swgr_2
      basis: Synthetic SWGR-2 evidence-channel pattern; not a section-supply diagnosis
    Generator_bus_evidence_loss:
      component: virtual_generator_bus
      basis: Synthetic generator-bus evidence-channel pattern; not generator-capacity diagnosis
    Standby_transfer_evidence_loss:
      component: virtual_standby_transfer
      basis: Synthetic standby-transfer evidence-channel pattern; not a transfer-sequence diagnosis
    outside_model:
      component: null
      outside: true
      basis: Explicit outside-model hypothesis for virtual fixture
  priors:
    values:
      Healthy: 0.076923
      Critical_A_path_loss: 0.076923
      Critical_B_path_loss: 0.076923
      Dual_critical_path_loss: 0.076923
      SATS_output_loss: 0.076923
      Essential_feed_loss: 0.076923
      Source_1_evidence_loss: 0.076923
      Source_2_evidence_loss: 0.076923
      SWGR_1_section_evidence_loss: 0.076923
      SWGR_2_section_evidence_loss: 0.076923
      Generator_bus_evidence_loss: 0.076923
      Standby_transfer_evidence_loss: 0.076923
      outside_model: 0.076924
    basis: Equal synthetic priors for software discrimination only; not empirical failure rates
