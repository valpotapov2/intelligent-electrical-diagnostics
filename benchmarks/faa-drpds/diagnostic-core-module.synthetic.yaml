# Synthetic-only module for exercising the real diagnostics-mvp engine on DRPDS-like redundancy.
# No node, level, point or value in this fixture corresponds to an energized facility.
schema_version: '1.3'
manifest:
  id: faa_drpds_virtual
  version: 0.2.0
  title: FAA DRPDS virtual diagnostic scenarios
  domain: Electrical power distribution — synthetic software fixture
  description: >
    Virtual-only low-voltage analog fixture to test posterior updates and safety-gateway
    contracts for a dual-path distribution architecture. It is not a site drawing,
    electrical model, measurement plan, or procedure for a real FAA facility.
  sources:
    - docs/objects/faa-drpds-technical-description.md
    - examples/objects/faa-drpds.generic.json
    - Synthetic test values are generated solely for software verification
objects:
  components:
    virtual_critical_bus_a:
      type: virtual_connection_locus
      title: Synthetic Critical Bus A path fault locus
    virtual_critical_bus_b:
      type: virtual_connection_locus
      title: Synthetic Critical Bus B path fault locus
    virtual_dual_critical:
      type: virtual_connection_locus
      title: Synthetic simultaneous critical path fault locus
    virtual_sats_output:
      type: virtual_connection_locus
      title: Synthetic SATS output fault locus
    virtual_essential_feed:
      type: virtual_connection_locus
      title: Synthetic essential distribution fault locus
    virtual_source_1:
      type: virtual_connection_locus
      title: Synthetic source-1 evidence channel pattern
    virtual_source_2:
      type: virtual_connection_locus
      title: Synthetic source-2 evidence channel pattern
    virtual_swgr_1:
      type: virtual_connection_locus
      title: Synthetic SWGR-section-1 evidence channel pattern
    virtual_swgr_2:
      type: virtual_connection_locus
      title: Synthetic SWGR-section-2 evidence channel pattern
    virtual_generator_bus:
      type: virtual_connection_locus
      title: Synthetic generator-bus readiness evidence channel pattern
    virtual_standby_transfer:
      type: virtual_connection_locus
      title: Synthetic standby-transfer evidence channel pattern
  nodes:
    - N_UTILITY_1
    - N_UTILITY_2
    - N_BUS_A
    - N_BUS_B
    - N_CRITICAL_OUT
    - N_ESSENTIAL_OUT
    - N_SOURCE_1_EVIDENCE
    - N_SOURCE_2_EVIDENCE
    - N_SWGR_1_SECTION_EVIDENCE
    - N_SWGR_2_SECTION_EVIDENCE
    - N_GENERATOR_BUS_EVIDENCE
    - N_STANDBY_TRANSFER_EVIDENCE
    - GND
  points:
    P_UTILITY_1:
      node: N_UTILITY_1
      location: Virtual source observation 1; no physical point exists
    P_UTILITY_2:
      node: N_UTILITY_2
      location: Virtual source observation 2; no physical point exists
    P_BUS_A:
      node: N_BUS_A
      location: Virtual Critical Bus A observation; no physical point exists
    P_BUS_B:
      node: N_BUS_B
      location: Virtual Critical Bus B observation; no physical point exists
    P_CRITICAL_OUT:
      node: N_CRITICAL_OUT
      location: Virtual critical-load output observation; no physical point exists
    P_ESSENTIAL_OUT:
      node: N_ESSENTIAL_OUT
      location: Virtual essential-load output observation; no physical point exists
    P_SOURCE_1_EVIDENCE:
      node: N_SOURCE_1_EVIDENCE
      location: Virtual source-1 evidence channel; no physical point exists
    P_SOURCE_2_EVIDENCE:
      node: N_SOURCE_2_EVIDENCE
      location: Virtual source-2 evidence channel; no physical point exists
    P_SWGR_1_SECTION_EVIDENCE:
      node: N_SWGR_1_SECTION_EVIDENCE
      location: Virtual SWGR-section-1 evidence channel; no physical point exists
    P_SWGR_2_SECTION_EVIDENCE:
      node: N_SWGR_2_SECTION_EVIDENCE
      location: Virtual SWGR-section-2 evidence channel; no physical point exists
    P_GENERATOR_BUS_EVIDENCE:
      node: N_GENERATOR_BUS_EVIDENCE
      location: Virtual generator-bus evidence channel; no physical point exists
    P_STANDBY_TRANSFER_EVIDENCE:
      node: N_STANDBY_TRANSFER_EVIDENCE
      location: Virtual standby-transfer evidence channel; no physical point exists
links: []
quantities:
  dc_voltage:
    title: Synthetic virtual signal level
    unit: V
    kind: numeric
instruments:
  virtual_meter:
    title: Synthetic software-only meter
    version: 1
    input: Programmatic adapter only; no physical instrument is connected
    time:
      first: 1.0
      next: 1.0
    connection:
      input_type: isolated
      common_earthed: false
      isolation_confirmed: true
      safe_connection_confirmed: true
      basis: Virtual software channel; no physical connection exists
      max_input: 10.0
      max_input_unit: V
      input_resistance_ohm: 1000000.0
    profiles:
      dc_voltage:
        range: [0.0, 5.5]
        unit: V
        resolution: 0.01
        accuracy:
          pct: 0.0
          abs: 0.01
checks:
  - quantity: dc_voltage
    points: [P_UTILITY_1, P_UTILITY_2, P_BUS_A, P_BUS_B, P_CRITICAL_OUT, P_ESSENTIAL_OUT, P_SOURCE_1_EVIDENCE, P_SOURCE_2_EVIDENCE, P_SWGR_1_SECTION_EVIDENCE, P_SWGR_2_SECTION_EVIDENCE, P_GENERATOR_BUS_EVIDENCE, P_STANDBY_TRANSFER_EVIDENCE]
    powered: true
    requirements:
      N_UTILITY_1: &virtual_requirement
        unit: V
        range: [0.0, 5.5]
        accuracy:
          max_error: 0.05
          at_value: 2.5
          basis: Synthetic tolerance for distinguishing virtual values only
        connection:
          common_node: GND
          isolation_required: false
          earthed_common_ok: true
          max_level: 5.5
          level_unit: V
          min_input_resistance_ohm: 1000.0
          basis: Virtual connection within software fixture
        basis: Synthetic virtual-signal range
      N_UTILITY_2: *virtual_requirement
      N_BUS_A: *virtual_requirement
      N_BUS_B: *virtual_requirement
      N_CRITICAL_OUT: *virtual_requirement
      N_ESSENTIAL_OUT: *virtual_requirement
      N_SOURCE_1_EVIDENCE: *virtual_requirement
      N_SOURCE_2_EVIDENCE: *virtual_requirement
      N_SWGR_1_SECTION_EVIDENCE: *virtual_requirement
      N_SWGR_2_SECTION_EVIDENCE: *virtual_requirement
      N_GENERATOR_BUS_EVIDENCE: *virtual_requirement
      N_STANDBY_TRANSFER_EVIDENCE: *virtual_requirement
faults:
  modes:
    Healthy:
      component: null
      basis: Baseline mode of synthetic virtual fixture
    Critical_A_path_loss:
      component: virtual_critical_bus_a
      basis: Synthetic fault mode, not a physical fault declaration
    Critical_B_path_loss:
